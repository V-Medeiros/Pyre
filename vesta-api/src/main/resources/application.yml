spring:
  application:
    name: vesta-api
  datasource:
    url: ${VESTA_DATABASE_URL:jdbc:postgresql://localhost:5432/vesta}
    username: ${VESTA_DATABASE_USERNAME:vesta}
    password: ${VESTA_DATABASE_PASSWORD:vesta}
    hikari:
      maximum-pool-size: ${VESTA_DATABASE_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${VESTA_MAIL_HOST:localhost}
    port: ${VESTA_MAIL_PORT:1025}
    username: ${VESTA_MAIL_USERNAME:}
    password: ${VESTA_MAIL_PASSWORD:}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

vesta:
  security:
    jwt-secret: ${VESTA_JWT_SECRET:local-development-secret-change-before-production-123456}
    issuer: ${VESTA_JWT_ISSUER:vesta-api}
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    cookie-secure: ${VESTA_COOKIE_SECURE:false}
    require-https: ${VESTA_REQUIRE_HTTPS:false}
  cors:
    allowed-origins: ${VESTA_ALLOWED_ORIGINS:http://localhost:5173}
  mail:
    from: ${VESTA_MAIL_FROM:no-reply@vesta.local}
    frontend-url: ${VESTA_FRONTEND_URL:http://localhost:5173}
