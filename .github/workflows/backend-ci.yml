name: Backend CI

on:
  pull_request:
    paths:
      - "vesta-api/**"
      - "compose.yaml"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main, vesta-backend]
    paths:
      - "vesta-api/**"
      - "compose.yaml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify API
        working-directory: vesta-api
        run: |
          chmod +x mvnw
          ./mvnw -B verify
      - name: Build API container
        run: docker build -t vesta-api:ci vesta-api
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            vesta-api/target/surefire-reports
            vesta-api/target/site/jacoco
