services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vesta
      POSTGRES_USER: vesta
      POSTGRES_PASSWORD: vesta
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vesta -d vesta"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - vesta-postgres:/var/lib/postgresql/data

  api:
    build:
      context: ./vesta-api
    environment:
      SPRING_PROFILES_ACTIVE: local
      VESTA_DATABASE_URL: jdbc:postgresql://postgres:5432/vesta
      VESTA_DATABASE_USERNAME: vesta
      VESTA_DATABASE_PASSWORD: vesta
      VESTA_JWT_SECRET: local-development-secret-change-before-production-123456
      VESTA_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  vesta-postgres:

